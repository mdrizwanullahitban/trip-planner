name: Build .NET
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build TripPlanner.Api/TripPlanner.Api.csproj --configuration Release
      - run: dotnet build TripPlanner.Client/TripPlanner.Client.csproj --configuration Release
